name: hydrosage_app
description: "Leafify - Visual Foliar Diagnostics & Botanical Almanac for Leafy Greens"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  fl_chart: ^0.68.0
  camera: ^0.10.6
  image_picker: ^1.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
